name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · swift:6.0 · build (-warnings-as-errors) + test
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  apple:
    name: macOS 15 · swift test + iOS Simulator build of every product
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Build all products for the iOS Simulator (includes the SwiftUI lab and StoreKit adapters)
        run: xcodebuild build -scheme RetentionDecisionKit-Package -destination 'generic/platform=iOS Simulator'

  mutation:
    name: Mutation check · every mutant must fail the suite
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Run every mutant (a surviving or non-compiling mutant fails the job)
        run: MUTANT_TIMEOUT=180 bash scripts/mutation-check.sh
